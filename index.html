<!-- בתוך רינדור כל כרטיס מסוף (התאם לשמות המשתנים של הכרטיס ב-index.html במידת הצורך): -->
<div class="terminal-card" data-terminal-id="${t.id}">
  <div class="terminal-header">
    <div class="terminal-title">${t.name} <span class="terminal-id">(${t.id})</span></div>
    <div class="terminal-meta">
      סף התראה: ₪${Number(t.threshold ?? 3000).toLocaleString("he-IL")} •
      <span class="target-inline">
        יעד מילוי: <strong id="target-val-${t.id}">${Number(t.baseTargetK ?? 15)}k</strong>
        <button
          type="button"
          class="icon-edit-btn"
          title="ערוך יעד מילוי"
          aria-label="ערוך יעד מילוי"
          onclick="openEditTargetModal('${t.id}')"
        >✏️</button>
      </span>
    </div>
  </div>

  <div class="terminal-controls">
    <div class="cassette-box">
      <span class="cassette-label">במחסנית (₪)</span>
      <span class="cassette-amount" id="cassette-val-${t.id}">${Number(t.balance ?? 0).toLocaleString("he-IL")}</span>
    </div>

    <button
      type="button"
      class="btn-fill"
      onclick="quickFillTerminal('${t.id}')"
    >למלא ${Number(t.baseTargetK ?? 15)}k</button>

    <button
      type="button"
      class="btn-secondary"
      onclick="markRefilled('${t.id}')"
    >סמן הטענה</button>

    <button
      type="button"
      class="btn-remove"
      title="הסר מסוף"
      onclick="removeTerminal('${t.id}')"
    >✕</button>
  </div>
</div>
