<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATM Pro — ניהול קו כספומטים למפיצים</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --alert-bg: #fff5f5;
      --alert-border: #f2d6d6;
      --text: #111827;
      --muted: #6b7280;
      --primary: #1d4ed8;
      --primary-soft: #eff6ff;
      --success-soft: #f0fdf4;
      --success-border: #bbf7d0;
      --success: #15803d;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      direction: rtl;
    }

    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .badge-pro {
      background: var(--primary);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .container {
      max-width: 1050px;
      margin: 20px auto;
      padding: 0 16px 40px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .stat-label { font-size: 0.82rem; color: var(--muted); }
    .stat-value { font-size: 1.35rem; font-weight: 800; margin-top: 4px; }

    .terminal-card {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 18px;
      margin-bottom: 10px;
      border-radius: 12px;
      background: var(--alert-bg);
      border: 1px solid var(--alert-border);
    }

    .terminal-card.ok {
      background: var(--card);
      border-color: var(--border);
    }

    .terminal-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .row-index {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #111827;
      font-weight: 800;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .terminal-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .terminal-title {
      font-weight: 800;
      font-size: 1rem;
    }

    .terminal-meta {
      font-size: 0.86rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .target-inline {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .icon-edit-btn {
      background: transparent;
      border: none;
      padding: 1px 4px;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      border-radius: 6px;
    }

    .icon-edit-btn:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .terminal-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .metric-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 82px;
    }

    .metric-label {
      font-size: 0.74rem;
      color: var(--muted);
    }

    .metric-val {
      font-weight: 800;
      font-size: 1rem;
      color: var(--text);
    }

    .fill-display {
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      background: var(--primary-soft);
      border: 1px solid #93c5fd;
      color: var(--primary);
      white-space: nowrap;
    }

    .fill-display.ok-badge {
      background: var(--success-soft);
      border-color: var(--success-border);
      color: var(--success);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 8px;
      padding: 7px 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-whatsapp {
      background: #16a34a;
      border-color: #16a34a;
      color: #fff;
    }

    .auth-box {
      max-width: 420px;
      margin: 50px auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .days-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }

    .day-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f9fafb;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .hidden { display: none !important; }
    .status-note { font-size: 0.88rem; color: var(--muted); }
  </style>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <!-- מסך התחברות / הרשמה -->
  <div id="authSection" class="auth-box">
    <div class="brand">
      <span>ATM Pro</span>
      <span class="badge-pro">מפיצים</span>
    </div>
    <p class="status-note" style="margin:0">התחבר לחשבון המפיץ או הירשם ל-14 ימי ניסיון.</p>
    <input id="emailInput" type="email" placeholder="אימייל" autocomplete="email" />
    <input id="passwordInput" type="password" placeholder="סיסמה (לפחות 6 תווים)" autocomplete="current-password" />
    <button id="loginBtn" type="button" class="btn-primary">התחברות</button>
    <button id="registerBtn" type="button">הרשמה + 14 יום חינם</button>
    <div id="authError" style="color:#b91c1c;font-size:0.88rem;"></div>
  </div>

  <!-- מסך ניהול ראשי -->
  <div id="appSection" class="hidden">
    <header class="topbar">
      <div class="brand">
        <span>ATM Pro — ניהול קו כספומטים</span>
        <span id="userEmailBadge" class="status-note"></span>
      </div>
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="חיפוש מסוף / מספר..." style="width:185px;padding:6px 10px;" />
        <button id="toggleRouteBtn" type="button">📅 ימי קו</button>
        <button id="toggleCasBtn" type="button">🏦 כספונט</button>
        <button id="whatsappBtn" type="button" class="btn-whatsapp">💬 שלח לוואטסאפ</button>
        <button id="logoutBtn" type="button">יציאה</button>
      </div>
    </header>

    <main class="container">
      <!-- הגדרת ימי קו -->
      <section id="routePanel" class="panel hidden">
        <strong>הגדרת ימי קו</strong>
        <div id="daysContainer" class="days-row"></div>
        <button id="saveRouteBtn" type="button" class="btn-primary">שמור ימי קו</button>
        <span id="routeSavedMsg" class="status-note"></span>
      </section>

      <!-- הגדרות וסנכרון כספונט -->
      <section id="casPanel" class="panel hidden">
        <strong>חיבור וסנכרון CASMobile (casmobile.co.il)</strong>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0;">
          <input id="casUserInput" type="text" placeholder="שם משתמש בכספונט" />
          <input id="casPassInput" type="password" placeholder="סיסמה בכספונט" />
        </div>
        <button id="saveAndSyncCasBtn" type="button" class="btn-primary">שמור ובקש סנכרון מכספונט</button>
        <div id="casSyncStatus" class="status-note" style="margin-top:8px;"></div>
      </section>

      <!-- סיכום נתונים -->
      <section class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">מסופים פעילים</div>
          <div id="statCount" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">במחסנית</div>
          <div id="statBalance" class="stat-value">₪0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">נותר להטעין במסלול</div>
          <div id="statToLoad" class="stat-value">₪0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">חבילות 5k מהבנק</div>
          <div id="statPacks5k" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">התראות יתרה נמוכה</div>
          <div id="statAlerts" class="stat-value">0</div>
        </div>
      </section>

      <!-- רשימת מסופים -->
      <section id="terminalsList"></section>
    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBKQfbitijJHfIGAKg9N2aNvT6BCHEYsCU",
      authDomain: "atm-distributors-pro.firebaseapp.com",
      projectId: "atm-distributors-pro",
      storageBucket: "atm-distributors-pro.firebasestorage.app",
      messagingSenderId: "431026876840",
      appId: "1:431026876840:web:619e1e27a24d3d69e92d9d"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const DAYS = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];

    let currentUser = null;
    let currentTerminals = [];
    let searchQuery = "";
    let unsubscribeTerminals = null;
    let unsubscribeCas = null;

    function formatAmountILS(val) {
      const num = Number(val ?? 0);
      return Number.isFinite(num) ? num.toLocaleString("he-IL") : "0";
    }

    function getTerminalThreshold(t) {
      const parsed = Number(t.threshold);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : 3000;
    }

    function isTenthAdjustmentDay(dateObj = new Date()) {
      const dayOfMonth = dateObj.getDate();
      return dayOfMonth >= 8 && dayOfMonth <= 12;
    }

    function getEffectiveTargetK(t, dateObj = new Date()) {
      const baseK = Number(t.baseTargetK ?? 15);
      const dayOfWeek = dateObj.getDay();
      let factor = 1;
      if (dayOfWeek === 4) {
        factor = Number(t.thursdayMultiplier ?? 1.25);
      } else if (dayOfWeek >= 1 && dayOfWeek <= 3) {
        factor = Number(t.midweekMultiplier ?? 1);
      }
      if (isTenthAdjustmentDay(dateObj)) {
        factor *= Number(t.tenthMultiplier ?? 1.15);
      }
      return Math.max(0, Math.round(baseK * factor));
    }

    function calcLoadAmountILS(balance, targetK) {
      const targetAmount = Number(targetK ?? 15) * 1000;
      const currentBal = Number(balance ?? 0);
      return Math.max(0, targetAmount - currentBal);
    }

    function calcPacks5k(loadAmountILS) {
      return Math.round(Number(loadAmountILS ?? 0) / 5000);
    }

    function renderTerminalCard(t, index) {
      const id = String(t.id ?? "");
      const name = String(t.name ?? `מסוף ${id}`);
      const thresholdNum = getTerminalThreshold(t);
      const threshold = formatAmountILS(thresholdNum);
      const targetK = getEffectiveTargetK(t);
      const rawBalance = Number(t.balance ?? 0);
      const balanceFormatted = formatAmountILS(rawBalance);
      const loadAmount = calcLoadAmountILS(rawBalance, targetK);
      const packs5k = calcPacks5k(loadAmount);
      const isAlert = rawBalance <= thresholdNum;

      const fillLabelHtml = loadAmount > 0
        ? `<span class="fill-display">למלא ₪${formatAmountILS(loadAmount)} (${packs5k}×5k)</span>`
        : `<span class="fill-display ok-badge">תקין (0)</span>`;

      return `
        <div class="terminal-card ${isAlert ? "" : "ok"}" data-terminal-id="${id}">
          <div class="terminal-right">
            <span class="row-index">${index + 1}</span>
            <div class="terminal-header">
              <div class="terminal-title">${name}</div>
              <div class="terminal-meta">
                <span>מזהה: ${id}</span>
                <span>•</span>
                <span>סף התראה: ₪${threshold}</span>
              </div>
            </div>
          </div>

          <div class="terminal-left">
            <div class="metric-col">
              <span class="metric-label">במחסנית</span>
              <span class="metric-val">₪${balanceFormatted}</span>
            </div>

            <div class="metric-col">
              <span class="metric-label">יעד מילוי</span>
              <span class="target-inline">
                <strong class="metric-val" id="target-val-${id}">${targetK}k</strong>
                <button
                  type="button"
                  class="icon-edit-btn"
                  title="ערוך יעד מילוי"
                  aria-label="ערוך יעד מילוי"
                  onclick="openEditTargetModal('${id}')"
                >✏️</button>
              </span>
            </div>

            ${fillLabelHtml}

            <button
              type="button"
              onclick="markRefilled('${id}')"
            >סמן הטענה</button>
          </div>
        </div>
      `;
    }

    function updateStatsAndList(terminals) {
      const q = searchQuery.trim().toLowerCase();
      const filtered = q
        ? terminals.filter(
            (t) =>
              String(t.name || "").toLowerCase().includes(q) ||
              String(t.id || "").toLowerCase().includes(q)
          )
        : terminals;

      const listEl = document.getElementById("terminalsList");
      if (!filtered.length) {
        listEl.innerHTML = `<div class="panel status-note">אין מסופים להצגה. לחץ על "כספונט" כדי לבקש סנכרון לחשבון זה.</div>`;
      } else {
        listEl.innerHTML = filtered.map((t, idx) => renderTerminalCard(t, idx)).join("");
      }

      const totalBalance = filtered.reduce((acc, t) => acc + Number(t.balance ?? 0), 0);
      const totalToLoad = filtered.reduce(
        (acc, t) => acc + calcLoadAmountILS(t.balance, getEffectiveTargetK(t)),
        0
      );
      const totalPacks5k = filtered.reduce(
        (acc, t) => acc + calcPacks5k(calcLoadAmountILS(t.balance, getEffectiveTargetK(t))),
        0
      );
      const alertsCount = filtered.filter(
        (t) => Number(t.balance ?? 0) <= getTerminalThreshold(t)
      ).length;

      document.getElementById("statCount").textContent = String(filtered.length);
      document.getElementById("statBalance").textContent = `₪${formatAmountILS(totalBalance)}`;
      document.getElementById("statToLoad").textContent = `₪${formatAmountILS(totalToLoad)}`;
      document.getElementById("statPacks5k").textContent = String(totalPacks5k);
      document.getElementById("statAlerts").textContent = String(alertsCount);
    }

    window.openEditTargetModal = async function (terminalId) {
      if (!currentUser) return;
      const t = currentTerminals.find((x) => String(x.id) === String(terminalId));
      const currentK = t ? Number(t.baseTargetK ?? 15) : 15;
      const input = prompt(`הזן יעד מילוי בסיסי חדש באלפים (k) למסוף ${terminalId}:`, String(currentK));
      if (input === null) return;
      const parsedK = Number(input);
      if (!Number.isFinite(parsedK) || parsedK < 0) {
        alert("יש להזין מספר תקין באלפים");
        return;
      }
      await db
        .collection("distributors")
        .doc(currentUser.uid)
        .collection("terminals")
        .doc(String(terminalId))
        .set({ baseTargetK: parsedK }, { merge: true });
    };

    window.markRefilled = async function (terminalId) {
      if (!currentUser) return;
      await db
        .collection("distributors")
        .doc(currentUser.uid)
        .collection("terminals")
        .doc(String(terminalId))
        .set({ lastRefilledAt: Date.now() }, { merge: true });
    };

    function renderDaysSelector(selectedDays = []) {
      const wrap = document.getElementById("daysContainer");
      wrap.innerHTML = DAYS.map((day, idx) => {
        const checked = selectedDays.includes(idx) ? "checked" : "";
        return `<label class="day-chip"><input type="checkbox" value="${idx}" ${checked} /> ${day}</label>`;
      }).join("");
    }

    function bindUserListeners(uid) {
      if (unsubscribeTerminals) unsubscribeTerminals();
      if (unsubscribeCas) unsubscribeCas();

      const userRef = db.collection("distributors").doc(uid);

      userRef.collection("settings").doc("route").get().then((snap) => {
        const days = snap.exists && Array.isArray(snap.data().days) ? snap.data().days : [0, 2, 4];
        renderDaysSelector(days);
      });

      unsubscribeCas = userRef.collection("settings").doc("cas_sync").onSnapshot((snap) => {
        const statusEl = document.getElementById("casSyncStatus");
        if (!snap.exists) {
          statusEl.textContent = "טרם הוגדרו פרטי כספונט.";
          return;
        }
        const data = snap.data() || {};
        if (data.username && !document.getElementById("casUserInput").value) {
          document.getElementById("casUserInput").value = data.username;
        }
        if (data.syncRequested) {
          statusEl.textContent = "בקשת סנכרון מכספונט פעילה — ממתין לסקריפט הסנכרון...";
        } else if (data.lastSyncError) {
          statusEl.textContent = `שגיאת סנכרון: ${data.lastSyncError}`;
        } else if (data.lastSyncedAt) {
          const dt = new Date(Number(data.lastSyncedAt)).toLocaleString("he-IL");
          statusEl.textContent = `סונכרן לאחרונה מכספונט: ${dt} (${data.lastSyncCount ?? 0} מסופים)`;
        }
      });

      unsubscribeTerminals = userRef.collection("terminals").onSnapshot((snap) => {
        currentTerminals = snap.docs
          .map((d) => ({ id: d.id, ...d.data() }))
          .sort((a, b) => Number(a.order ?? 999) - Number(b.order ?? 999));
        updateStatsAndList(currentTerminals);
      });
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value || "";
      updateStatsAndList(currentTerminals);
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      document.getElementById("authError").textContent = "";
      const email = document.getElementById("emailInput").value.trim();
      const pass = document.getElementById("passwordInput").value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (err) {
        document.getElementById("authError").textContent = err.message;
      }
    });

    document.getElementById("registerBtn").addEventListener("click", async () => {
      document.getElementById("authError").textContent = "";
      const email = document.getElementById("emailInput").value.trim();
      const pass = document.getElementById("passwordInput").value;
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        const now = Date.now();
        await db.collection("distributors").doc(cred.user.uid).set({
          email,
          subscriptionStatus: "trial",
          trialEndsAt: now + 14 * 24 * 60 * 60 * 1000,
          createdAt: now
        }, { merge: true });
      } catch (err) {
        document.getElementById("authError").textContent = err.message;
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => auth.signOut());

    document.getElementById("toggleRouteBtn").addEventListener("click", () => {
      document.getElementById("routePanel").classList.toggle("hidden");
    });

    document.getElementById("toggleCasBtn").addEventListener("click", () => {
      document.getElementById("casPanel").classList.toggle("hidden");
    });

    document.getElementById("saveRouteBtn").addEventListener("click", async () => {
      if (!currentUser) return;
      const days = [...document.querySelectorAll("#daysContainer input:checked")].map((el) => Number(el.value));
      await db.collection("distributors").doc(currentUser.uid).collection("settings").doc("route").set({
        days,
        updatedAt: Date.now()
      }, { merge: true });
      document.getElementById("routeSavedMsg").textContent = "נשמר";
      setTimeout(() => { document.getElementById("routeSavedMsg").textContent = ""; }, 2000);
    });

    document.getElementById("saveAndSyncCasBtn").addEventListener("click", async () => {
      if (!currentUser) return;
      const username = document.getElementById("casUserInput").value.trim();
      const password = document.getElementById("casPassInput").value;
      if (!username || !password) {
        alert("יש להזין שם משתמש וסיסמה של כספונט");
        return;
      }
      await db.collection("distributors").doc(currentUser.uid).collection("settings").doc("cas_sync").set({
        username,
        password,
        syncRequested: true,
        updatedAt: Date.now()
      }, { merge: true });
    });

    document.getElementById("whatsappBtn").addEventListener("click", () => {
      const lines = ["*דוח מצב מסופים — ATM Pro*"];
      currentTerminals.forEach((t, idx) => {
        const targetK = getEffectiveTargetK(t);
        const loadAmt = calcLoadAmountILS(t.balance, targetK);
        const packs = calcPacks5k(loadAmt);
        lines.push(`${idx + 1}. ${t.name} (${t.id}): מחסנית ₪${formatAmountILS(t.balance)} | יעד ${targetK}k | למלא ₪${formatAmountILS(loadAmt)} (${packs}×5k)`);
      });
      const url = `https://wa.me/?text=${encodeURIComponent(lines.join("\n"))}`;
      window.open(url, "_blank");
    });

    auth.onAuthStateChanged((user) => {
      currentUser = user;
      if (user) {
        document.getElementById("authSection").classList.add("hidden");
        document.getElementById("appSection").classList.remove("hidden");
        document.getElementById("userEmailBadge").textContent = user.email || "";
        bindUserListeners(user.uid);
      } else {
        if (unsubscribeTerminals) unsubscribeTerminals();
        if (unsubscribeCas) unsubscribeCas();
        document.getElementById("appSection").classList.add("hidden");
        document.getElementById("authSection").classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
