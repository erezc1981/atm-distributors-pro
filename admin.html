<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://atm-sync.erezc1981.workers.dev; frame-src https://atm-distributors-pro.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>ATM — ניהול מנויים</title>
  <style>
    :root {
      --bg: #f4f6f9; --card: #fff; --text: #111827; --muted: #6b7280; --border: #e5e7eb;
      --primary: #2563eb; --success: #15803d; --warn: #b45309; --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    .topbar { background: #1e293b; color: #fff; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; }
    .topbar a { color: #bfdbfe; }
    .container { max-width: 1100px; margin: 18px auto; padding: 0 14px 40px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
    .stat b { display: block; font-size: 1.5rem; }
    .stat span { color: var(--muted); font-size: 0.85rem; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .filters button, button { font-family: inherit; cursor: pointer; border-radius: 8px; padding: 7px 12px; font-weight: 600; border: 1px solid var(--border); background: #fff; }
    .filters button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    input { font-family: inherit; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .card.pending { border-color: #f59e0b; box-shadow: 0 0 0 2px #fde68a; }
    .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
    .email { font-weight: 800; }
    .meta { color: var(--muted); font-size: 0.86rem; display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; }
    .badge { padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; border: 1px solid transparent; }
    .b-owner { background: #ede9fe; color: #5b21b6; }
    .b-active { background: #dcfce7; color: var(--success); }
    .b-trial { background: #dbeafe; color: #1d4ed8; }
    .b-expired, .b-canceled { background: #fee2e2; color: var(--danger); }
    .b-soon { background: #fef3c7; color: var(--warn); }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-green { background: #16a34a; border-color: #16a34a; color: #fff; }
    .btn-danger { color: var(--danger); border-color: #fecaca; }
    .request { background: #fffbeb; border: 1px dashed #f59e0b; border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 0.88rem; }
    .payments { margin-top: 8px; font-size: 0.85rem; }
    .payments table { border-collapse: collapse; width: 100%; }
    .payments td, .payments th { border-bottom: 1px solid var(--border); padding: 4px 6px; text-align: right; }
    .auth-box { max-width: 380px; margin: 60px auto; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
    .hidden { display: none !important; }
    .note { color: var(--muted); font-size: 0.88rem; }
    .error { color: var(--danger); }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="authSection" class="auth-box">
    <strong>ניהול מנויים — כניסת מנהל</strong>
    <input id="emailInput" type="email" placeholder="אימייל" autocomplete="email" />
    <input id="passwordInput" type="password" placeholder="סיסמה" autocomplete="current-password" />
    <button id="loginBtn" class="btn-primary" type="button">התחברות</button>
    <div id="authError" class="error"></div>
  </div>

  <div id="noAccess" class="auth-box hidden">
    <strong>אין הרשאה</strong>
    <p class="note">הדף הזה מיועד למנהל המערכת בלבד.</p>
    <a href="./">חזרה לאפליקציה</a>
    <button id="logoutBtn2" type="button">יציאה</button>
  </div>

  <div id="appSection" class="hidden">
    <header class="topbar">
      <strong>⚙️ ניהול מנויים</strong>
      <div style="display:flex;gap:10px;align-items:center;">
        <a href="./">חזרה לאפליקציה</a>
        <button id="logoutBtn" type="button">יציאה</button>
      </div>
    </header>
    <main class="container">
      <section class="stats">
        <div class="stat"><b id="sTotal">0</b><span>מפיצים</span></div>
        <div class="stat"><b id="sActive">0</b><span>מנוי פעיל</span></div>
        <div class="stat"><b id="sTrial">0</b><span>בניסיון</span></div>
        <div class="stat"><b id="sExpired">0</b><span>פג / בוטל</span></div>
        <div class="stat"><b id="sPending">0</b><span>בקשות שדרוג ממתינות</span></div>
        <div class="stat"><b id="sMrr">₪0</b><span>הכנסה חודשית משוערת</span></div>
      </section>
      <div class="filters">
        <button type="button" class="active" data-filter="all">הכל</button>
        <button type="button" data-filter="pending">בקשות ממתינות</button>
        <button type="button" data-filter="soon">פג בקרוב (7 ימים)</button>
        <button type="button" data-filter="trial">בניסיון</button>
        <button type="button" data-filter="active">פעילים</button>
        <button type="button" data-filter="expired">פג / בוטל</button>
        <input id="searchInput" type="search" placeholder="חיפוש אימייל / טלפון" />
      </div>
      <div id="list"></div>
      <p class="note">מחירים: חודשי ₪99, שנתי ₪890. הפעלה מאריכה מסוף התקופה הנוכחית (אם עדיין בתוקף) או מהיום.</p>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
